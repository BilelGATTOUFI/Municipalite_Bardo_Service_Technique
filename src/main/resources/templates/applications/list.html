<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>لوحة متابعة مطالب البلدية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light" dir="rtl">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📑 منظومة متابعة ورقمنة المطالب البلدية</h2>
        <a href="/applications/new" class="btn btn-primary">+ تسجيل مطلب جديد</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>رقم الملف</th>
                    <th>اسم صاحب المطلب</th>
                    <th>نوع المطلب</th>
                    <th>العنوان</th>
                    <th>الحالة بالحالية</th>
                    <th>تاريخ الإيداع</th>
                    <th>الإجراءات</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="app : ${applications}">
                    <td th:text="${app.fileNumber}" class="fw-bold"></td>
                    <td th:text="${app.citizen.fullName}"></td>
                    <td th:text="${app.type != null ? app.type.name : 'غير محدد'}"></td>
                    <td th:text="${app.locationAddress}"></td>
                    <td>
                        <span class="badge bg-warning text-dark" th:text="${app.currentStatus.displayName}"></span>
                    </td>
                    <td th:text="${#temporals.format(app.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/applications/{id}(id=${app.id})}" class="btn btn-sm btn-info text-white">تفاصيل الملف</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(applications)}">
                    <td colspan="7" class="text-center text-muted py-4">لا توجد مطالب مسجلة حالياً في النظام.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
