<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل المطلب - بلدية باردو</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark py-3">
                    <h4 class="mb-0 text-center">✏️ تعديل بيانات المطلب رقم: <span th:text="${application.fileNumber}"></span></h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/applications/update/{id}(id=${application.id})}" method="post">

                        <!-- الحالة الحالية -->
                        <div class="mb-3">
                            <label class="form-label">الحالة الحالية للمطلب</label>
                            <select name="currentStatus" class="form-select" required>
                                <option th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:text="${status}"
                                        th:selected="${status == application.currentStatus}">
                                </option>
                            </select>
                        </div>

                        <!-- العنوان / الموقع -->
                        <div class="mb-3">
                            <label class="form-label">العنوان / موقع الإشغال</label>
                            <textarea name="locationAddress" class="form-control" rows="2" th:text="${application.locationAddress}" required></textarea>
                        </div>

                        <!-- ملاحظات -->
                        <div class="mb-3">
                            <label class="form-label">ملاحظات إضافية</label>
                            <textarea name="notes" class="form-control" rows="3" th:text="${application.notes}"></textarea>
                        </div>

                        <!-- الأزرار -->
                        <div class="d-flex justify-content-between pt-3">
                            <a th:href="@{/applications/{id}(id=${application.id})}" class="btn btn-outline-secondary">إلغاء وعودة</a>
                            <button type="submit" class="btn btn-warning px-4">حفظ التعديلات</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
